configs:
  caddy-file:
    file: ./Caddyfile
  ofelia-conf:
    file: ./ofelia.conf

networks:
  backend:
    internal: true
  frontend:

secrets:
  website-key:
    file: website/.env.keys

services:
  db-init:
    build:
      args:
        - TRANSIT_SYSTEM=wmata
    network_mode: none
    volumes:
      - database:/home/data

  cron:
    command: ["daemon"]
    configs:
      - source: ofelia-conf
        target: /etc/ofelia.conf
    depends_on:
      - db-init
    image: mcuadros/ofelia:0.4.0-beta.5
    network_mode: none
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  reverse-proxy:
    configs:
      - source: caddy-file
        target: /etc/caddy/Caddyfile
    depends_on:
      - website
    environment:
      - ACME_CA=${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      - DOMAIN=${DOMAIN:-localhost}
    image: caddy:2.11.4
    networks:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/UDP"
    restart: unless-stopped
    volumes:
      - caddy-config:/config
      - caddy-data:/data

  website:
    build: website
    command: ["fire-alarm-website"]
    depends_on:
      - db-init
    entrypoint:
      [
        "dotenvx",
        "run",
        "--env-file=.env.prod",
        "--env-keys-file=/run/secrets/website-key",
        "--",
      ]
    environment:
      - DATABASE=sqlite://data/db.sqlite
      - URL=0.0.0.0:8080
    expose:
      - 8080
    networks:
      - backend
    restart: unless-stopped
    secrets:
      - website-key
    volumes:
      - database:/home/data

volumes:
  caddy-config:
  caddy-data:
  database:
  service-timestamp:
